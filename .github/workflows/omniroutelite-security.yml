name: OmniRouteLite key security

on:
  pull_request:
    paths:
      - "OmniRouteLite/**"
      - ".github/workflows/omniroutelite-security.yml"

permissions:
  contents: read

jobs:
  node-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run key-storage security tests
        run: node --test OmniRouteLite/security.test.js
