# OMNI WARSHIPS T-013.1/T-013.2 — compilation Android (APK) via GameCI, CORRIGE.
# Corrections auditees contre le action.yml REEL de game-ci/unity-builder@v4 :
#   - expressions ${{ }} propres : les backslashs parasites \${{ }}
#     auraient transmis une chaine litterale au lieu des secrets ;
#   - inputs valides v4 : androidExportType: androidPackage (APK) ;
#     androidBuildAppType / androidBuildSystem / androidArchitecture
#     N EXISTENT PAS en v4 (ARM64 et IL2CPP sont regles par le projet
#     via AndroidBuildConfig.Configure, appele par buildMethod) ;
#   - buildMethod explicite : scene de bataille incluse EXPLICITEMENT
#     dans BuildPlayerOptions.scenes (BattleSceneGuard) ;
#   - permissions: contents: write (requis pour la release brouillon) ;
#   - verification des secrets SANS jamais les afficher ;
#   - verification de l APK produite (taille + sha256) : aucune simulation ;
#   - scripts shell propres pour shellcheck (SC2034, SC2012 corriges).
# T-013.2 — DECLENCHEMENT SANS MAIN : ce workflow vit uniquement sur la
# branche warships/android-build (PR #16 ouverte, main INTACT). Un
# workflow_dispatch n est PAS utilisable depuis l interface tant que le
# fichier n existe pas sur la branche par defaut -> declenchement par
# PUSH limite a cette branche avec filtre de chemins : la compilation ne
# part QUE si le fichier warships/unity/ci/BUILD-TRIGGER.md est modifie
# (commit explicite, editable depuis le navigateur du telephone). Les
# secrets du depot sont disponibles pour les evenements push de la
# branche. workflow_dispatch conserve pour usage futur.
# T-013.7 — ACTIVATION PERSONAL PAR IDENTIFIANTS (plus de .ulf) :
#   Unity a supprime l activation manuelle des licences Personal
#   (license.unity3d.com/manual -> /new, « Offline activation is
#   available only for Enterprise and Industry seats »). La methode
#   actuelle (auditee dans game-ci/cli, scripts activate.sh) : le Unity
#   Licensing Client DU CONTENEUR DU BUILD demande un siege avec
#   UNITY_EMAIL + UNITY_PASSWORD (methode personal, --activate-all
#   --include-personal, mesuree sur 2022.3.62f3). Le secret
#   UNITY_LICENSE (.ulf) N EST PLUS REQUIS NI TRANSMIS. Le siege est
#   rendu automatiquement a la fin du build (return_license, trap EXIT,
#   meme conteneur). REQUIS : 2FA DESACTIVEE sur le compte Unity (l
#   activation headless ne peut repondre a aucun defi 2FA ni
#   verification d appareil) — compte dedie au CI recommande.
#   Tant que les secrets ne sont pas configures, le run s arrete a l
#   etape de verification (AUCUNE compilation Unity lancee) — run rouge
#   ATTENDU sur le commit d integration.
name: Warships GameCI (APK Android)

on:
  push:
    branches: ['warships/android-build']
    paths:
      - 'warships/unity/ci/BUILD-TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilation APK (Unity 2022.3, ARM64, IL2CPP, activation Personal par identifiants)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verification des secrets (jamais affiches dans les logs)
        env:
          MAIL: ${{ secrets.UNITY_EMAIL }}
          PASS: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -e
          verify_secret() {
            trimmed=$(printf '%s' "$2" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$trimmed" ]; then
              echo "::error::secret $1 absent ou vide — Settings > Secrets and variables > Actions"
              exit 1
            fi
            if [ "$trimmed" != "$2" ]; then
              echo "::error::secret $1 contient un caractere parasite (espace/retour a la ligne en debut ou fin) — le coller a nouveau sans espaces autour"
              exit 1
            fi
          }
          verify_secret UNITY_EMAIL "$MAIL"
          verify_secret UNITY_PASSWORD "$PASS"
          echo "Secrets UNITY_EMAIL / UNITY_PASSWORD presents et propres (aucune valeur affichee)."
          echo "Methode d activation T-013.7 : Personal PAR IDENTIFIANTS dans le conteneur du build"
          echo "(plus de UNITY_LICENSE/.ulf — 2FA du compte Unity DESACTIVEE requise, siege rendu automatiquement)."

      - name: Liberation d espace disque (image Unity Android lourde)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - name: Compilation Unity + APK (activation Personal par identifiants, scene explicite via buildMethod)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: warships/unity
          buildMethod: OmniWarships.Unity.EditorTools.WarshipsBuildScript.BuildAndroid
          androidExportType: androidPackage
          versioning: None

      - name: Verification APK produite (taille + empreinte, aucune simulation)
        run: |
          set -e
          shopt -s nullglob
          apks=(warships/unity/Builds/*.apk)
          shopt -u nullglob
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::AUCUNE APK produite dans warships/unity/Builds/ — le build n a pas reussi"
            exit 1
          fi
          apk="${apks[0]}"
          stat -c '%n : %s octets' "$apk"
          sha256sum "$apk"

      - name: Artefact APK telechargeable
        uses: actions/upload-artifact@v4
        with:
          name: omni-warships-apk
          path: warships/unity/Builds/*.apk
          if-no-files-found: error

      - name: Release GitHub (brouillon, lien telechargeable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="android-build-${{ github.run_number }}"
          gh release create "$tag" warships/unity/Builds/*.apk \
            --draft --repo "$GITHUB_REPOSITORY" \
            --title "OMNI WARSHIPS build Android ${{ github.run_number }}" \
            --notes "APK ARM64 IL2CPP compilee par GameCI (Unity 2022.3, scene de bataille incluse explicitement, activation Personal par identifiants T-013.7). Brouillon : verifier l installation sur Tecno KN3 avant toute publication." \
            || echo "::warning::release non creee (voir l artefact APK)"

      - name: Nettoyage du runner (fichiers temporaires supprimes meme en cas d echec)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/alfdir 2>/dev/null || true
          rm -f activation.alf code.txt error.png error.html 2>/dev/null || true
          echo "Nettoyage runner : la licence vit dans le conteneur du build (rendue par trap EXIT), aucun fichier de licence ne doit rester sur le runner."
