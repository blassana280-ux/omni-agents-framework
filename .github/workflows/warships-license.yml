# OMNI WARSHIPS T-013.3 — acquisition de la licence Unity Personal SANS PC.
# SECURITE (depot PUBLIC) : le .ulf (licence Unity nominative) n est JAMAIS
# publie — ni artefact (les artefacts ne sont PAS prives sur un depot
# public), ni release, ni commit, ni capture d ecran. Il va UNIQUEMENT
# dans le secret UNITY_LICENSE via l API GitHub.
# Le PAT (secret ACCESS_TOKEN) est injecte UNIQUEMENT dans l etape de
# stockage — JAMAIS dans l etape d activation (qui ne voit que les
# identifiants Unity). Si ACCESS_TOKEN est absent : echec explicite,
# AUCUN repli par artefact.
# OUTIL EPINGLE : unity-license-activate@0.3.9 (organisation game-ci,
# fork maintenu de MizoTake) — version exacte, integrite verifiee par
# npm a l installation, AUCUN script d installation dans le package ;
# code audite : seul domaine contacte = license.unity3d.com (formulaire
# Unity ID). Dependances transitives (puppeteer, crypto-js) resolues
# par npm — limite documentee, aucune certification excessive.
# DECLENCHEMENT : push sur warships/android-build limite au fichier
#   warships/unity/ci/LICENSE-TRIGGER.md. workflow_dispatch conserve
#   pour usage futur.
# ATTENDU : sans les secrets UNITY_EMAIL / UNITY_PASSWORD / ACCESS_TOKEN,
#   le run s arrete a la verification (echec rapide, aucune action sur
#   le compte Unity, aucun artefact).
name: Warships licence Unity (acquisition .ulf sans PC)

on:
  push:
    branches: ['warships/android-build']
    paths:
      - 'warships/unity/ci/LICENSE-TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-license:
    name: Demande .alf + activation + stockage du secret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verification des secrets (jamais affiches dans les logs)
        env:
          MAIL: ${{ secrets.UNITY_EMAIL }}
          PASS: ${{ secrets.UNITY_PASSWORD }}
          PAT: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -e
          verify_secret() {
            trimmed=$(printf '%s' "$2" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$trimmed" ]; then
              echo "::error::secret $1 absent ou vide — Settings > Secrets and variables > Actions"
              exit 1
            fi
            if [ "$trimmed" != "$2" ]; then
              echo "::error::secret $1 contient un caractere parasite (espace/retour a la ligne en debut ou fin)"
              exit 1
            fi
          }
          verify_secret UNITY_EMAIL "$MAIL"
          verify_secret UNITY_PASSWORD "$PASS"
          verify_secret ACCESS_TOKEN "$PAT"
          echo "Secrets UNITY_EMAIL / UNITY_PASSWORD / ACCESS_TOKEN presents et propres (aucune valeur affichee)."

      - name: Generation du fichier de demande .alf (image Unity CI, aucune licence requise)
        run: |
          set -e
          tag=""
          for rev in 3 2 1; do
            if docker manifest inspect "unityci/editor:ubuntu-2022.3.62f1-android-$rev" >/dev/null 2>&1; then
              tag="ubuntu-2022.3.62f1-android-$rev"
              break
            fi
          done
          if [ -z "$tag" ]; then
            echo "::error::aucune image unityci/editor ubuntu-2022.3.62f1-android (revisions 1-3) trouvee sur Docker Hub"
            exit 1
          fi
          echo "Image Unity CI : unityci/editor:$tag"
          mkdir -p /tmp/alfdir
          docker run --rm -v /tmp/alfdir:/project -w /project \
            "unityci/editor:$tag" \
            unity-editor -batchmode -nographics -createManualActivationFile -quit
          shopt -s nullglob
          alfs=(/tmp/alfdir/*.alf)
          shopt -u nullglob
          if [ "${#alfs[@]}" -eq 0 ]; then
            echo "::error::AUCUN fichier .alf genere par unity-editor — consulter la sortie de ce step"
            exit 1
          fi
          cp "${alfs[0]}" activation.alf
          stat -c 'alf genere : %n : %s octets' activation.alf

      - name: Activation (unity-license-activate 0.3.9 epingle, audite)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
        run: |
          set -e
          args=("$UNITY_EMAIL" "$UNITY_PASSWORD" "activation.alf")
          if [ -n "$UNITY_TOTP_KEY" ]; then
            args+=(--authenticator-key "$UNITY_TOTP_KEY")
          fi
          npx --yes unity-license-activate@0.3.9 "${args[@]}"
          shopt -s nullglob
          ulfs=(*.ulf)
          shopt -u nullglob
          if [ "${#ulfs[@]}" -eq 0 ]; then
            echo "::error::AUCUN fichier .ulf produit — consulter les logs de ce step (rien n est publie)"
            exit 1
          fi
          stat -c 'ulf produit : %n : %s octets (contenu jamais affiche)' "${ulfs[0]}"
          rm -f -- activation.alf

      - name: Stockage du secret UNITY_LICENSE puis verification (PAT uniquement ici)
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          shopt -s nullglob
          ulfs=(*.ulf)
          shopt -u nullglob
          if [ "${#ulfs[@]}" -eq 0 ]; then
            echo "::error::fichier .ulf introuvable pour le stockage"
            exit 1
          fi
          ulf_value=$(<"${ulfs[0]}")
          printf '%s' "$ulf_value" | GH_TOKEN="$ACCESS_TOKEN" gh secret set UNITY_LICENSE --repo "$GH_REPO"
          unset ulf_value
          rm -f -- "${ulfs[@]}"
          updated=$(GH_TOKEN="$ACCESS_TOKEN" gh secret list --repo "$GH_REPO" --json name,updatedAt --jq '.[] | select(.name == "UNITY_LICENSE") | .updatedAt')
          if [ -z "$updated" ]; then
            echo "::error::secret UNITY_LICENSE introuvable apres la mise a jour"
            exit 1
          fi
          echo "Secret UNITY_LICENSE mis a jour et verifie (horodatage : $updated — valeur jamais affichee)."
