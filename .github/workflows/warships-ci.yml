name: Omni Warships CI

on:
  push:
    branches: ['warships/**']
    paths: ['warships/**', '.github/workflows/warships-ci.yml', '.github/workflows/warships-blender-fbx.yml', '.github/workflows/warships-gameci.yml', '.github/workflows/warships-license.yml', '.github/workflows/warships-cli-release.yml']
  pull_request:
    paths: ['warships/**', '.github/workflows/warships-ci.yml', '.github/workflows/warships-blender-fbx.yml', '.github/workflows/warships-gameci.yml', '.github/workflows/warships-license.yml', '.github/workflows/warships-cli-release.yml']

jobs:
  data:
    name: Données (matrice, specs, scénarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Matrice de fidélité (Omni Fidelity Lab)
        run: |
          set +e
          out=$(python3 warships/tools/omni-fidelity-lab/validate_matrix.py 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then msg=$(echo "$out" | tr '\n' '|' | tail -c 600); echo "::error::validate_matrix rc=$rc — $msg"; exit $rc; fi
      - name: Specs de navires (Omni Asset Factory)
        run: |
          set +e
          out=$(python3 warships/tools/omni-asset-factory/validate_specs.py 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then msg=$(echo "$out" | tr '\n' '|' | tail -c 600); echo "::error::validate_specs rc=$rc — $msg"; exit $rc; fi
      - name: Scénarios (Omni Battle Sandbox)
        run: |
          set +e
          out=$(python3 warships/tools/omni-battle-sandbox/validate_scenarios.py 2>&1)
          rc=$?
          if [ $rc -ne 0 ]; then msg=$(echo "$out" | tr '\n' '|' | tail -c 600); echo "::error::validate_scenarios rc=$rc — $msg"; exit $rc; fi

  core:
    name: Noyau C# (build + tests xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilation
        run: |
          set +e
          out=$(dotnet build warships/core/tests/OmniWarships.Core.Tests.csproj --configuration Release 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then msg=$(echo "$out" | tr '\n' '|' | tail -c 900); echo "::error::build rc=$rc — $msg"; exit $rc; fi
      - name: Tests
        run: |
          set +e
          out=$(dotnet test warships/core/tests/OmniWarships.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then msg=$(echo "$out" | tr '\n' '|' | tail -c 900); echo "::error::tests rc=$rc — $msg"; exit $rc; fi

  unity:
    name: Couche Unity (structure + copies exactes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validateur couche Unity (Omni Unity Bridge)
        run: |
          set +e
          out=$(python3 warships/tools/omni-unity-bridge/validate_unity_layer.py 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then msg=$(echo "$out" | tr '\n' '|' | tail -c 900); echo "::error::validate_unity_layer rc=$rc — $msg"; exit $rc; fi

      - name: Licence et build T-013.8 — verification sans activation, build par GameCI CLI v0.1.72
        run: |
          set -e
          lic="$GITHUB_WORKSPACE/.github/workflows/warships-license.yml"
          gc="$GITHUB_WORKSPACE/.github/workflows/warships-gameci.yml"
          # T-013.8 — 1) le workflow de licence reste une GARDE DE
          # VERIFICATION : AUCUNE activation, AUCUN outil npm, AUCUN
          # navigateur, AUCUN fichier de licence, AUCUN PAT
          for motif in 'npm ci' 'npm install' 'npm run' 'npx ' 'puppeteer' 'chromium' 'unity-license-activate' 'license.unity3d.com' 'unityci/editor' 'docker run' 'activation.alf' '.ulf' 'ACCESS_TOKEN' 'gh secret set' 'UNITY_TOTP_KEY' 'UNITY_LICENSE'; do
            if grep -qF "$motif" "$lic"; then
              echo "::error::warships-license.yml ne doit plus contenir le motif : $motif (T-013.7/T-013.8 : verification SANS activation)"
              exit 1
            fi
          done
          grep -qF 'verify_secret UNITY_EMAIL' "$lic"
          grep -qF 'verify_secret UNITY_PASSWORD' "$lic"
          grep -q 'always()' "$lic"
          # T-013.8 — 2) le workflow de build compile via GameCI CLI
          # v0.1.72 en UNE SEULE commande (un seul conteneur : siege
          # Personal + compilation + restitution). L action de build
          # v4 est INTERDITE : ses scripts montes dans /steps du
          # conteneur ECRASENT ceux de l image et ne contiennent PAS
          # le chemin personal de la CLI (bug bloquant T-013.7).
          gcnc=$(grep -v '^[[:space:]]*#' "$gc")
          if echo "$gcnc" | grep -qF 'unity-builder'; then
            echo "::error::warships-gameci.yml ne doit plus utiliser game-ci/unity-builder : ses scripts montes dans /steps du conteneur ne contiennent PAS le chemin personal de la CLI (bug bloquant T-013.7 corrige par T-013.8)"
            exit 1
          fi
          if echo "$gcnc" | grep -qF 'game-ci/cli@'; then
            echo "::error::warships-gameci.yml : l action composite game-ci/cli@ est ECARTEE (install.sh racine commite sans bit executable au tag v0.1.72, exit 126 constate par run CI) — utiliser l installateur officiel scripts/install.sh epingle au tag (T-013.8)"
            exit 1
          fi
          if echo "$gcnc" | grep -qF 'game-ci activate'; then
            echo "::error::warships-gameci.yml : activation isolee INTERDITE (T-013.8 : siege + compilation + restitution dans le MEME conteneur, une seule commande de build)"
            exit 1
          fi
          if grep -qF 'verify_secret UNITY_LICENSE' "$gc"; then
            echo "::error::warships-gameci.yml ne doit plus exiger UNITY_LICENSE (T-013.7 : methode personal par identifiants)"
            exit 1
          fi
          echo "$gcnc" | grep -qF 'raw.githubusercontent.com/game-ci/cli/v0.1.72/scripts/install.sh'
          echo "$gcnc" | grep -qF -- '-- v0.1.72'
          echo "$gcnc" | grep -qF 'game-ci build'
          echo "$gcnc" | grep -qF 'OmniWarships.Unity.EditorTools.WarshipsBuildScript.BuildAndroid'
          echo "$gcnc" | grep -qF -- '--targetPlatform Android'
          grep -qF 'UNITY_EMAIL' "$gc"
          grep -qF 'UNITY_PASSWORD' "$gc"
          # T-013.8 — 3) aucun workflow ne reference l ancien dossier npm
          # d activation (supprime du depot) — motif construit pour ne
          # pas matcher ce fichier lui-meme
          lt="license"
          pat="${lt}-tools"
          for wf in "$GITHUB_WORKSPACE"/.github/workflows/warships-*.yml; do
            if grep -qF "$pat" "$wf"; then
              echo "::error::$wf ne doit plus referencer ${lt}-tools (T-013.7 : dependances npm supprimees)"
              exit 1
            fi
          done
          echo "T-013.8 OK : licence = verifications sans activation, build = GameCI CLI v0.1.72 en une seule commande (un seul conteneur, action de build v4 INTERDITE), ancien dossier npm absent des workflows."

  gameci-cli:
    name: GameCI CLI corrige T-013.9 (source patchee + tests + verificateur, sans activation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source officielle game-ci/cli EPINGLEE (commit exact, integrite par SHA git)
        uses: actions/checkout@v4
        with:
          repository: game-ci/cli
          ref: 7da0cea2f31799a4cbd79c1d452c254023f4f678
          path: cli-src
      - name: Overlay du correctif T-013.9 (minimal, tracable, dist/ INTACT)
        run: |
          set -e
          cd cli-src
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "7da0cea2f31799a4cbd79c1d452c254023f4f678" ]; then
            echo "::error::commit game-ci/cli inattendu : $actual (epingle : 7da0cea2f31799a4cbd79c1d452c254023f4f678)"
            exit 1
          fi
          cp ../warships/unity/ci/gameci-cli-secure/patched-src/src/model/image-environment-factory.ts src/model/
          cp ../warships/unity/ci/gameci-cli-secure/patched-src/src/model/secure-env.test.ts src/model/
          # Correctif MINIMAL prouve : exactement 1 fichier modifie + 1 test
          # ajoute, RIEN d autre.
          actual_status=$(git status --porcelain)
          expected_status=$' M src/model/image-environment-factory.ts\n?? src/model/secure-env.test.ts'
          if [ "$actual_status" != "$expected_status" ]; then
            echo "::error::correctif non minimal ou source derivee — attendu exactement 2 fichiers (1 modifie + 1 test ajoute) ; obtenu :"
            echo "$actual_status"
            exit 1
          fi
          # dist/ = les scripts montes dans /steps du conteneur (chemin
          # personal, trap EXIT de restitution) : INTACT octet par octet.
          git diff --quiet -- dist/ || { echo "::error::dist/ (scripts personal) ne doit pas etre modifie"; exit 1; }
          echo "Correctif minimal T-013.9 applique : heritage ENV des identifiants (references --env SANS valeur, valeurs par l environnement du processus docker) ; dist/ (scripts personal + trap EXIT) INTACT octet par octet."
      - name: Setup Bun (1.3.13 epinglee — 1.4.0 casse --compile, cf release-cli.yml officiel du tag)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Dependances (lockfile gele)
        run: |
          set -e
          cd cli-src
          bun install --frozen-lockfile
      - name: Tests du correctif T-013.9 (valeurs 100% FACTICES, jamais affichees)
        run: |
          set -e
          cd cli-src
          bun test ./src/model/image-environment-factory.test.ts ./src/model/secure-env.test.ts ./src/model/system/system.test.ts ./src/model/docker.test.ts ./src/model/secret-redaction.test.ts
      - name: Verificateur strict — 8 modes d echec eprouves + 1 acceptation (fixtures factices)
        run: |
          set -e
          bash warships/unity/ci/gameci-cli-secure/test-verify-gameci-cli.sh
      - name: Options reelles de la commande build (sources du tag v0.1.72)
        run: |
          set -e
          # Les options de la commande build sont prouvees sur les SOURCES
          # du tag epingle (ce CLI desactive --help et --version :
          # .help(false)/.version(false) dans src/cli.ts au tag). Le binaire
          # utilise par le build est le CLI CORRIGE construit depuis cette
          # meme source epinglee (release T-013.9), pas le binaire officiel
          # qui met les identifiants dans la chaine de commande.
          d="$RUNNER_TEMP/gameci-src"
          mkdir -p "$d"
          base="https://raw.githubusercontent.com/game-ci/cli/v0.1.72/src/command-options"
          curl -sSL --retry 3 -o "$d/unity-options.ts" "$base/unity-options.ts"
          curl -sSL --retry 3 -o "$d/build-options.ts" "$base/build-options.ts"
          curl -sSL --retry 3 -o "$d/versioning-options.ts" "$base/versioning-options.ts"
          curl -sSL --retry 3 -o "$d/android-options.ts" "$base/android-options.ts"
          grep -qF ".option('targetPlatform'" "$d/unity-options.ts" || { echo "::error::targetPlatform absente des sources du tag"; exit 1; }
          grep -qF "unityLicensingMethod: {" "$d/unity-options.ts" || { echo "::error::unityLicensingMethod absent des sources du tag"; exit 1; }
          grep -qF ".option('buildsPath'" "$d/build-options.ts" || { echo "::error::buildsPath absent des sources du tag"; exit 1; }
          grep -qF ".option('buildMethod'" "$d/build-options.ts" || { echo "::error::buildMethod absent des sources du tag"; exit 1; }
          grep -qF ".option('versioningStrategy'" "$d/versioning-options.ts" || { echo "::error::versioningStrategy absent des sources du tag"; exit 1; }
          grep -qF "choices: ['androidPackage', 'androidAppBundle', 'androidStudioProject']" "$d/android-options.ts" || { echo "::error::androidExportType/androidPackage absent des sources du tag"; exit 1; }
          echo "Options prouvees dans les sources du tag v0.1.72 : targetPlatform, buildMethod, buildsPath, versioningStrategy, androidExportType (androidPackage), unityLicensingMethod (auto = serial, file, floating, personal)."
      - name: Scripts personal présents dans l arborescence source (preuve du conteneur réel)
        run: |
          set -e
          base="$GITHUB_WORKSPACE/cli-src/dist"
          steps_dir="$base/platforms/ubuntu/steps"
          if [ ! -d "$steps_dir" ]; then
            echo "::error::dist/platforms/ubuntu/steps introuvable dans la source epinglee ($steps_dir)"
            exit 1
          fi
          # Ces scripts sont CEUX que le CLI corrige monte dans /steps du
          # conteneur (src/model/docker.ts de game-ci/cli, dist/ recopie
          # INTACTE dans l archive de release) : leur contenu prouve le
          # chemin personal — pas ceux d une action tierce.
          grep -q -- '--include-personal' "$steps_dir/activate.sh" || { echo "::error::activate.sh sans chemin personal (--include-personal absent)"; exit 1; }
          grep -qF 'trap return_license_once EXIT' "$steps_dir/runsteps.sh" || { echo "::error::runsteps.sh sans trap EXIT de restitution"; exit 1; }
          grep -qF 'Returning personal license seat' "$steps_dir/return_license.sh" || { echo "::error::return_license.sh sans branche personal"; exit 1; }
          grep -qF '/steps/runsteps.sh' "$base/platforms/ubuntu/entrypoint.sh" || { echo "::error::entrypoint.sh sans runsteps"; exit 1; }
          echo "Scripts du conteneur prouves dans la source epinglee : activate.sh (branche personal), runsteps.sh (trap EXIT arme apres l activation), return_license.sh (branche personal), entrypoint.sh (orchestration /steps/runsteps.sh)."
      - name: Résolution du projet warships/unity (test local, AUCUNE connexion Unity)
        run: |
          set -e
          pv=warships/unity/ProjectSettings/ProjectVersion.txt
          if [ ! -f "$pv" ]; then
            echo "::error::$pv introuvable : le projet Unity ne serait pas resolu par engineDetection"
            exit 1
          fi
          grep -q 'm_EditorVersion: 2022.3.62f1' "$pv" || { echo "::error::version d editeur inattendue dans ProjectVersion.txt"; cat "$pv"; exit 1; }
          bs=warships/unity/Assets/OmniWarships/Editor/WarshipsBuildScript.cs
          grep -q 'namespace OmniWarships.Unity.EditorTools' "$bs" || { echo "::error::namespace du buildMethod introuvable"; exit 1; }
          grep -q 'class WarshipsBuildScript' "$bs" || { echo "::error::classe du buildMethod introuvable"; exit 1; }
          grep -q 'static void BuildAndroid' "$bs" || { echo "::error::methode BuildAndroid introuvable"; exit 1; }
          echo "Projet resolu : Unity 2022.3.62f1, buildMethod OmniWarships.Unity.EditorTools.WarshipsBuildScript.BuildAndroid present dans le code reel."
          echo "AUCUNE commande ici ne touche Unity : ce job ne prouve PAS une activation (siege = premier run reel du build)."

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint — validation réelle des 5 workflows warships (YAML, expressions, inputs des actions)
        run: |
          set -e
          curl -sSL --retry 3 -o /tmp/download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
          # signature REELLE du script : [[VERSION] DIR] — la version est
          # obligatoire car le script epingle v1.7.7 defaulte a 1.7.6.
          bash /tmp/download-actionlint.bash 1.7.7 /tmp
          /tmp/actionlint --version
          set +e
          out=$(/tmp/actionlint -color \
            .github/workflows/warships-ci.yml \
            .github/workflows/warships-blender-fbx.yml \
            .github/workflows/warships-gameci.yml \
            .github/workflows/warships-license.yml \
            .github/workflows/warships-cli-release.yml 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            msg=$(echo "$out" | tr '\n' '|' | cut -c1-900)
            echo "::error::actionlint rc=$rc — $msg"
            exit $rc
          fi
