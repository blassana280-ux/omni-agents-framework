# OMNI WARSHIPS T-013 — production REELLE des FBX par Blender en CI.
# Blender = GPL, gratuit, aucune licence requise : contrairement a Unity,
# la generation d'assets peut s'executer reellement ici.
#
# HISTORIQUE des echecs (documente honnetement) :
#   run 1 : ref checkout invalide (backslash parasite devant ${{ }}) — corrige ;
#   run 2 : blender exit 0 malgre erreur Python → --python-exit-code 1 + PYTHONPATH ;
#   run 3 : apt-get install blender > 20 min sur l'image Ubuntu 26 → timeout 25 min.
#           CORRECTION : Blender PORTABLE 4.2.3 LTS telecharge directement
#           (tarball officiel, version determinee, ~40 s) au lieu de l'apt massif.
# Les FBX sont commits dans Resources/Models (charges par ShipModelLibrary)
# ET publies en artefact telechargeable (avec les logs Blender).
name: Warships Assets (Blender FBX)

on:
  pull_request:
    paths:
      - "warships/tools/omni-asset-factory/**"
      - ".github/workflows/warships-blender-fbx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blender-fbx:
    name: Generateurs Blender -> FBX reels
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (tete de la PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Blender portable 4.2.3 LTS (telechargement direct, pas d'apt massif)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libegl1 libsm6 libice6
          curl -sSL --retry 3 -o blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xJf blender.tar.xz
          ./blender-4.2.3-linux-x64/blender --version

      - name: Execution des 6 generateurs (FBX reels, echec explicite)
        run: |
          BLENDER="$GITHUB_WORKSPACE/blender-4.2.3-linux-x64/blender"
          "$BLENDER" --version
          mkdir -p artifacts/fbx artifacts/log
          cd warships/tools/omni-asset-factory
          set -e
          set -o pipefail
          export PYTHONPATH="$PWD"
          run_gen () {
            name="$1";
            script="$2";
            echo "=== Generation $name (via $script) ==="
            "$BLENDER" --background --factory-startup --python "$script" \
              --python-exit-code 1 -- --out "../../artifacts/fbx/$name.fbx" \
              2>&1 | tee "../../artifacts/log/$name.log"
            if [ ! -s "../../artifacts/fbx/$name.fbx" ]; then
              echo "::error::Echec $name : $(tail -n 14 "../../artifacts/log/$name.log" | tr "\n" " " | cut -c1-600)"
              exit 1
            fi
            echo "OK $name.fbx : $(stat -c%s "../../artifacts/fbx/$name.fbx") octets"
          }
          run_gen ws-destroyer-01 gen_destroyer_blender.py
          run_gen ws-frigate-01   gen_frigate_blender.py
          run_gen ws-carrier-01   gen_carrier_blender.py
          run_gen ws-submarine-01 gen_submarine_blender.py
          run_gen ws-aircraft     gen_aircraft_blender.py
          run_gen ws-equipment    gen_equipment_blender.py

      - name: Verification des FBX (tailles reelles, aucune simulation)
        run: |
          cd artifacts/fbx
          ls -la
          for f in ws-destroyer-01 ws-frigate-01 ws-carrier-01 ws-submarine-01 ws-aircraft ws-equipment; do
            if [ ! -s "$f.fbx" ]; then
              echo "::error::FBX manquant ou vide : $f.fbx"
              exit 1
            fi
            size=$(stat -c%s "$f.fbx")
            if [ "$size" -lt 2000 ]; then
              echo "::error::FBX suspectement petit ($size octets) : $f.fbx"
              exit 1
            fi
            echo "OK $f.fbx : $size octets"
          done

      - name: Integration des FBX dans le projet Unity (commit)
        run: |
          git config user.name "omni-warships-bot"
          git config user.email "actions@github.com"
          mkdir -p warships/unity/Assets/OmniWarships/Resources/Models
          cp artifacts/fbx/ws-destroyer-01.fbx artifacts/fbx/ws-frigate-01.fbx \
             artifacts/fbx/ws-carrier-01.fbx artifacts/fbx/ws-submarine-01.fbx \
             artifacts/fbx/ws-aircraft.fbx artifacts/fbx/ws-equipment.fbx \
             warships/unity/Assets/OmniWarships/Resources/Models/
          git add warships/unity/Assets/OmniWarships/Resources/Models
          if [ -n "$(git status --porcelain warships/unity/Assets/OmniWarships/Resources/Models)" ]; then
            git commit -m "chore(assets): FBX reels generes par Blender 4.2.3 LTS en CI (destroyer, frigate, carrier, submarine, aircraft, equipment)"
            git push
            echo "FBX commites dans Resources/Models (charges au runtime par ShipModelLibrary)."
          else
            echo "FBX inchanges — aucun commit (idempotent)."
          fi

      - name: Artefact FBX + logs telechargeables
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-warships-fbx
          path: |
            artifacts/fbx/*.fbx
            artifacts/log/*.log
          if-no-files-found: warn
