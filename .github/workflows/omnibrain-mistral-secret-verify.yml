name: OmniBrain Mistral Secret Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnibrain-mistral-secret-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Mistral credential locally (no API request)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify secret is available without displaying it
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OMNI_PROVIDER: mistral
        shell: bash
        run: |
          set +x
          if [[ -z "${MISTRAL_API_KEY:-}" ]]; then
            echo "::error::MISTRAL_API_KEY is not available to this workflow."
            exit 1
          fi
          python -m omni providers --verify mistral
