# OMNI WARSHIPS — EXEMPLE GameCI (T-013.2, aligné sur le workflow réel).
# Ce fichier reste volontairement hors de .github/workflows/ : il est la
# référence documentaire. Le workflow ACTIF est
# .github/workflows/warships-gameci.yml : push sur warships/android-build
# limité à warships/unity/ci/BUILD-TRIGGER.md + workflow_dispatch (futur),
# secrets UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD requis.
# Inputs vérifiées contre le action.yml RÉEL de game-ci/unity-builder@v4 :
# androidExportType (androidPackage = APK) ; androidBuildAppType /
# androidBuildSystem / androidArchitecture N EXISTENT PAS en v4 (ARM64 et
# IL2CPP sont réglés par le projet via AndroidBuildConfig.Configure,
# appelé par buildMethod).
name: Warships GameCI (exemple — inactif)
on:
  push:
    branches: ['warships/android-build']
    paths:
      - 'warships/unity/ci/BUILD-TRIGGER.md'
  workflow_dispatch:

jobs:
  build-android:
    name: Compilation Android (exemple inactif)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compil + APK (Unity 2022.3.62f1, scène explicite)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: warships/unity
          buildMethod: OmniWarships.Unity.EditorTools.WarshipsBuildScript.BuildAndroid
          androidExportType: androidPackage
          versioning: None

      - name: Artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: omni-warships-apk
          path: |
            warships/unity/Builds/*.apk
          if-no-files-found: error
